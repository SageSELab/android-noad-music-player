apply plugin: 'com.android.library'

android {
  compileSdkVersion 28

  defaultConfig {
    minSdkVersion 7
    minSdkVersion 21
    targetSdkVersion 28
    versionCode 19
    versionName "1.3"
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.android.support:appcompat-v7:28.0.0'
}
